spring.application.name=housekeeper

# PostgreSQL, credentials can be overridden with environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/housekeeper}
spring.datasource.username=${DB_USER:housekeeper}
spring.datasource.password=${DB_PASSWORD:housekeeper}

# The schema comes only from Flyway; Hibernate checks on startup that the entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Key for the JWT signature (HS256): at least 32 bytes, Base64-encoded.
# Deliberately without a default, so the server refuses to start without JWT_SECRET.
housekeeper.jwt.secret=${JWT_SECRET}
