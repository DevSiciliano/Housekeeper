spring.application.name=housekeeper

# PostgreSQL, Zugangsdaten über Umgebungsvariablen überschreibbar
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/housekeeper}
spring.datasource.username=${DB_USER:housekeeper}
spring.datasource.password=${DB_PASSWORD:housekeeper}

# Das Schema kommt nur aus Flyway; Hibernate prüft beim Start, ob die Entities dazu passen
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
