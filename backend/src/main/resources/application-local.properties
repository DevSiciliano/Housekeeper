# Profile "local": starts without PostgreSQL, using in-memory H2 in PostgreSQL mode.
# All data is lost on every restart.
spring.datasource.url=jdbc:h2:mem:housekeeper;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

